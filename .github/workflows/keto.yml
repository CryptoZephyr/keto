name: Keto

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Git ref to diff against
        required: false
        default: origin/main
      changed:
        description: Optional single changed file (overrides git diff)
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYDRADB_BOLT_URL: bolt://127.0.0.1:7687
      HYDRADB_HTTP_URL: http://127.0.0.1:8443
      HYDRADB_AUTH_TOKEN: local-development-token-32-bytes
      HYDRADB_NAMESPACE: keto
      HYDRADB_GRAPH_ID: keto
      HYDRADB_CELL_ID: cell-0
      KETO_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start pinned HydraDB
        continue-on-error: true
        run: bash scripts/start-hydradb.sh

      - name: Index checked-out repository
        id: index
        run: |
          set +e
          node bin/keto.mjs index --repo . > index.log 2>&1
          status=$?
          set -e
          cat index.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Explain checked-out repository impact
        id: explain
        env:
          BASE: ${{ github.event.inputs.base || github.event.pull_request.base.sha || 'HEAD^' }}
          CHANGED: ${{ github.event.inputs.changed }}
          INDEX_STATUS: ${{ steps.index.outputs.status }}
        run: |
          set +e
          if [ -n "$CHANGED" ]; then
            node bin/keto.mjs explain --repo . --changed "$CHANGED" --json > explain.json
          else
            node bin/keto.mjs explain --repo . --base "$BASE" --json > explain.json
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ "$INDEX_STATUS" != "0" ]; then
            rm -f explain.json
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          fallback = {
              "mode": "full_suite",
              "reasons": [{"code": "hydradb_unavailable", "detail": "no valid Keto impact report"}],
              "selectedTests": [],
              "affectedTests": [],
              "affectedFiles": [],
              "changed": [],
          }
          try:
              data = json.loads(Path("explain.json").read_text(encoding="utf-8"))
          except Exception:
              data = fallback
          if not isinstance(data, dict):
              data = fallback
          if data.get("mode") != "selected" or not isinstance(data.get("selectedTests"), list) or not data.get("selectedTests"):
              data["mode"] = "full_suite"
              data["selectedTests"] = []
          Path("keto-agent.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("wrote keto-agent.json mode=" + data.get("mode", "full_suite"))
          PY

      - name: PR summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('keto-agent.json', 'utf8'));
            const reasons = (report.reasons || [])
              .map((r) => `- \`${r.code}\`: ${r.detail}`)
              .join('\n') || '- none';
            const tests = (report.affectedTests || [])
              .map((t) => {
                const path = typeof t === 'string' ? t : t.path;
                const evidence = t.paths && t.paths[0] ? t.paths[0].join(' <- ') : '';
                return `- ${path}${evidence ? ` (${evidence})` : ''}`;
              })
              .join('\n') || '- none (full suite)';
            const files = (report.affectedFiles || []).map((f) => `- ${f}`).join('\n') || '- none';
            const body = [
              '## Keto impact',
              '',
              `Mode: **${report.mode}**`,
              '',
              '### Changed',
              ...(report.changed || []).map((f) => `- ${f}`),
              '',
              '### Affected files',
              files,
              '',
              '### Affected tests',
              tests,
              '',
              '### Reasons',
              reasons,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Run tests from report (fail closed)
        run: node scripts/run-keto-report.mjs keto-agent.json .

      - name: Stop HydraDB
        if: always()
        run: docker rm -f keto-hydradb >/dev/null 2>&1 || true
